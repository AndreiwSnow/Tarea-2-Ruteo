services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.7
    container_name: ruteo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruteo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruteo_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ruteo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruteo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ruteo_pgdata:
    name: ruteo_pgdata
